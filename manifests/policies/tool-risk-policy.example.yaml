apiVersion: platform.example.com/v1alpha1
kind: AgentToolRiskPolicy
metadata:
  name: kubernetes-agent-tool-risk
  namespace: kagent
spec:
  defaultAction: deny
  rules:
    - name: allow-readonly-kubernetes-inspection
      match:
        toolNamePatterns:
          - "cluster-*_k8s_get_resources"
          - "cluster-*_k8s_describe_resource"
          - "cluster-*_k8s_get_events"
          - "cluster-*_k8s_get_resource_yaml"
      risk: green
      action: allow
    - name: require-approval-for-sensitive-reads
      match:
        toolNamePatterns:
          - "cluster-*_k8s_get_logs"
          - "cluster-*_k8s_exec"
      risk: yellow
      action: requireApproval
    - name: block-mutations-by-default
      match:
        toolNamePatterns:
          - "cluster-*_k8s_delete_*"
          - "cluster-*_k8s_patch_*"
          - "cluster-*_k8s_scale_*"
          - "cluster-*_k8s_rollout_*"
          - "cluster-*_k8s_create_*"
      risk: red
      action: deny
