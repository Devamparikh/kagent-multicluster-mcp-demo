apiVersion: v1
kind: Namespace
metadata:
  name: platform-tools
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-readonly
  namespace: platform-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events", "namespaces", "nodes", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-readonly
    namespace: platform-tools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-readonly
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-a-kubernetes-mcp
  namespace: platform-tools
  labels:
    app.kubernetes.io/name: kubernetes-mcp
    mcp.kagent.dev/expose: "true"
spec:
  selector:
    app.kubernetes.io/name: kubernetes-mcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
